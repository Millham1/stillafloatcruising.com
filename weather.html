<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruise Weather | Still Afloat</title>
<link rel="stylesheet" href="./css/styles.css?v=live-api-weather">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{
  background:
    radial-gradient(circle at top right, rgba(0,119,182,0.22), transparent 28%),
    radial-gradient(circle at left center, rgba(93,255,154,0.10), transparent 32%),
    linear-gradient(to bottom, #06111f 0%, #0b2238 40%, #102f4d 100%);
  min-height:100vh;
}
.weather-banner{
  position:relative;
  height:360px;
  overflow:hidden;
  background:url('./assets/images/weather header.png') center/cover no-repeat;
  border-bottom:6px solid var(--blue);
}
.weather-banner::after{
  content:'';
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:120px;
  background:linear-gradient(to bottom, rgba(6,17,31,0), #06111f 100%);
}
.weather-home-link{
  position:absolute;
  top:20px;
  left:20px;
  z-index:5;
  background:rgba(7,24,63,0.78);
  color:white;
  padding:12px 20px;
  border-radius:18px;
  text-decoration:none;
  font-weight:800;
}
.weather-shell{max-width:1200px;margin:auto;padding:36px 22px 80px;}
.weather-section{margin-bottom:54px;}
.weather-section h2{color:white;font-size:34px;margin-bottom:10px;}
.weather-section p{color:rgba(255,255,255,0.76);margin-bottom:24px;}
.weather-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px;}
.weather-tile{
  background:rgba(7,24,63,0.72);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:26px;
  backdrop-filter:blur(10px);
  padding:24px 14px;
  text-align:center;
  text-decoration:none;
  transition:all .22s ease;
  box-shadow:0 12px 24px rgba(0,0,0,0.16);
}
.weather-tile:hover{transform:translateY(-6px) scale(1.03);}
.weather-emoji{font-size:54px;margin-bottom:12px;}
.weather-location{color:white;font-weight:800;font-size:18px;margin-bottom:8px;}
.weather-temp{color:#5dff9a;font-size:28px;font-weight:900;}
.loading{color:white;text-align:center;padding:60px;font-size:20px;}
</style>
</head>
<body>
<header class="weather-banner">
  <a class="weather-home-link" href="index.html"><i class="fa-solid fa-house"></i> Home</a>
</header>

<main class="weather-shell">
<section class="weather-section">
  <h2>Embarkation Ports</h2>
  <p>Live weather conditions for major cruise departure ports.</p>
  <div class="weather-grid" id="embarkation-grid">
    <div class="loading">Loading live weather...</div>
  </div>
</section>

<section class="weather-section">
  <h2>Cruise Destinations</h2>
  <p>Live Caribbean and cruise destination conditions.</p>
  <div class="weather-grid" id="destination-grid">
    <div class="loading">Loading live weather...</div>
  </div>
</section>
</main>

<footer>
  <p>© 2026 Still Afloat LLC — Cruise smarter. Laugh more. Stay Afloat.</p>
</footer>

<script>
function renderTile(item){
  return `
    <a class="weather-tile" href="${item.forecastUrl}">
      <div class="weather-emoji">${item.emoji}</div>
      <div class="weather-location">${item.name}</div>
      <div class="weather-temp">${item.temp}°</div>
    </a>
  `;
}

async function loadWeather(){
  try {
    const response = await fetch('/api/weather');
    const data = await response.json();

    document.getElementById('embarkation-grid').innerHTML =
      data.embarkation.map(renderTile).join('');

    document.getElementById('destination-grid').innerHTML =
      data.destinations.map(renderTile).join('');

  } catch(error){
    document.getElementById('embarkation-grid').innerHTML = '<div class="loading">Unable to load weather.</div>';
    document.getElementById('destination-grid').innerHTML = '<div class="loading">Unable to load weather.</div>';
  }
}

loadWeather();
</script>
</body>
</html>
