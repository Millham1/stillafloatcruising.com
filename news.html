<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruise News | Still Afloat</title>
<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{
  background:
    radial-gradient(circle at top right, rgba(0,119,182,0.24), transparent 28%),
    radial-gradient(circle at left center, rgba(93,255,154,0.10), transparent 30%),
    linear-gradient(to bottom, #06111f 0%, #0b2238 35%, #102f4d 100%);
  min-height:100vh;
}

.news-shell{
  position:relative;
  padding-top:34px;
}

.news-wrap{
  max-width:1100px;
  margin:auto;
  padding:0 22px 70px;
}

.news-nav{
  display:flex;
  justify-content:flex-end;
  margin-bottom:20px;
}

.news-home-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(180deg, rgba(9,72,117,.96), rgba(4,33,66,.96));
  color:white;
  text-decoration:none;
  padding:12px 18px;
  border-radius:18px;
  border:1px solid rgba(123,214,255,.28);
  font-weight:800;
  box-shadow:0 12px 28px rgba(0,0,0,.28);
  transition:all .2s ease;
}

.news-home-link:hover{
  transform:translateY(-2px);
  color:#5dff9a;
  border-color:rgba(93,255,154,.34);
}

#full-news-feed article{
  transition:all .22s ease;
  border:1px solid rgba(255,255,255,0.08);
}

#full-news-feed article:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 38px rgba(0,0,0,0.24);
  border-color:rgba(93,255,154,0.24);
}
</style>
</head>
<body>
<header class="banner-header" id="top"><img class="banner-image" src="./assets/images/Youtube banner cropped.png" alt="Still Afloat YouTube banner"></header>

<main>
<section class="news-shell">
  <div class="news-wrap">

    <div class="news-nav">
      <a class="news-home-link" href="index.html">
        <i class="fa-solid fa-house"></i>
        Home
      </a>
    </div>

    <div id="full-news-feed"></div>
  </div>
</section>
</main>

<footer><p>© 2026 Still Afloat LLC — Cruise smarter. Laugh more. Stay Afloat.</p></footer>
<script src="./js/news.js"></script>
</body>
</html>
