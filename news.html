<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruise News | Still Afloat</title>
<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{
  background:
    radial-gradient(circle at top right, rgba(0,119,182,0.24), transparent 28%),
    radial-gradient(circle at left center, rgba(93,255,154,0.10), transparent 30%),
    linear-gradient(to bottom, #06111f 0%, #0b2238 35%, #102f4d 100%);
  min-height:100vh;
}

.news-shell{
  position:relative;
  padding-top:34px;
}

.news-wrap{
  max-width:1100px;
  margin:auto;
  padding:0 22px 70px;
}

#full-news-feed article{
  transition:all .22s ease;
  border:1px solid rgba(255,255,255,0.08);
}

#full-news-feed article:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 38px rgba(0,0,0,0.24);
  border-color:rgba(93,255,154,0.24);
}
</style>
</head>
<body>
<header class="banner-header" id="top"><img class="banner-image" src="./assets/images/Youtube banner cropped.png" alt="Still Afloat YouTube banner"></header>

<main>
<section class="news-shell">
  <div class="news-wrap">
    <div id="full-news-feed"></div>
  </div>
</section>
</main>

<footer><p>© 2026 Still Afloat LLC — Cruise smarter. Laugh more. Stay Afloat.</p></footer>
<script src="./js/news.js"></script>
</body>
</html>
