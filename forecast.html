<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forecast | Still Afloat</title>
<link rel="stylesheet" href="./css/styles.css">
<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#06111f;
  color:white;
}
.hero{
  position:relative;
  min-height:340px;
  padding:80px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    linear-gradient(rgba(6,17,31,.45), rgba(6,17,31,.62)),
    linear-gradient(135deg,#0077b6,#00b4d8);
  background-size:cover;
  background-position:center;
  overflow:hidden;
}
.hero::after{
  content:'';
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:120px;
  background:linear-gradient(to bottom, rgba(6,17,31,0), #06111f 100%);
}
.hero-content{
  position:relative;
  z-index:2;
  background:rgba(7,24,63,.45);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:28px;
  padding:28px 34px;
  max-width:760px;
}
.hero h1{
  margin:0 0 12px;
  font-size:64px;
  line-height:1;
}
.hero p{
  margin:0;
  font-size:22px;
  color:rgba(255,255,255,.92);
}
.nav-links{
  position:absolute;
  top:20px;
  left:20px;
  z-index:5;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
.nav-link{
  background:rgba(7,24,63,0.78);
  color:white;
  padding:12px 20px;
  border-radius:18px;
  text-decoration:none;
  font-weight:800;
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(8px);
  transition:.2s ease;
}
.nav-link:hover{
  transform:translateY(-2px);
  background:rgba(0,119,182,.88);
}
.forecast-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:16px;
  padding:30px;
  max-width:1200px;
  margin:auto;
}
.day-card{
  background:rgba(255,255,255,0.08);
  border-radius:22px;
  padding:18px;
  text-align:center;
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
}
.day-emoji{font-size:42px;margin-bottom:10px;}
.day-temp{font-size:26px;font-weight:800;color:#5dff9a;}
@media (max-width:768px){
  .hero{min-height:260px;padding:70px 16px;}
  .hero h1{font-size:42px;}
  .hero p{font-size:18px;}
  .hero-content{padding:22px;}
  .nav-links{left:12px;right:12px;gap:8px;}
  .nav-link{padding:10px 14px;font-size:14px;}
}
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="nav-links">
    <a class="nav-link" href="index.html">🏠 Home</a>
    <a class="nav-link" href="weather.html">🌦️ Weather</a>
  </div>

  <div class="hero-content">
    <h1 id="title">Loading Forecast...</h1>
    <p>10-day cruise weather outlook</p>
  </div>
</div>

<div class="forecast-grid" id="forecast"></div>

<script>
const PEXELS_API_KEY = 'P82hqxcbAMVh4XpB7Dr3zwUrzWY1kldO6Q8QvO9XkJ8FXGsl4iH6ebzA';

const locations = {
  miami:{name:'Miami',lat:25.7617,lon:-80.1918,query:'Miami cruise port beach'},
  'port-canaveral':{name:'Canaveral',lat:28.3922,lon:-80.6077,query:'Port Canaveral cruise ship'},
  'fort-lauderdale':{name:'Ft Lauderdale',lat:26.1224,lon:-80.1373,query:'Fort Lauderdale cruise port'},
  tampa:{name:'Tampa',lat:27.9506,lon:-82.4572,query:'Tampa waterfront cruise'},
  galveston:{name:'Galveston',lat:29.3013,lon:-94.7977,query:'Galveston cruise terminal'},
  nassau:{name:'Nassau',lat:25.0443,lon:-77.3504,query:'Nassau Bahamas cruise beach'},
  cozumel:{name:'Cozumel',lat:20.4229,lon:-86.9223,query:'Cozumel beach Mexico'},
  'st-thomas':{name:'St Thomas',lat:18.3381,lon:-64.8941,query:'St Thomas Caribbean beach'},
  'grand-cayman':{name:'Grand Cayman',lat:19.3133,lon:-81.2546,query:'Grand Cayman tropical beach'},
  cococay:{name:'CocoCay',lat:25.8170,lon:-77.9390,query:'Perfect Day CocoCay Bahamas'},
  'great-stirrup':{name:'Great Stirrup',lat:25.8244,lon:-77.9120,query:'Great Stirrup Cay Bahamas'},
  'san-juan':{name:'San Juan',lat:18.4655,lon:-66.1057,query:'San Juan Puerto Rico cruise'},
  aruba:{name:'Aruba',lat:12.5211,lon:-69.9683,query:'Aruba tropical beach'},
  'costa-maya':{name:'Costa Maya',lat:18.7140,lon:-87.7090,query:'Costa Maya Mexico beach'},
  roatan:{name:'Roatán',lat:16.3247,lon:-86.5365,query:'Roatan Honduras tropical island'}
};

function emoji(code){
  if([0].includes(code)) return '☀️';
  if([1,2].includes(code)) return '🌤️';
  if([3].includes(code)) return '☁️';
  if([45,48].includes(code)) return '🌫️';
  if([51,53,55,61,63,65,80,81,82].includes(code)) return '🌧️';
  if([95,96,99].includes(code)) return '⛈️';
  return '⛅';
}

async function loadHeroImage(location){
  try {
    const response = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(location.query)}&per_page=1`, {
      headers: {
        Authorization: PEXELS_API_KEY
      }
    });

    const data = await response.json();

    if(data.photos && data.photos.length > 0){
      const image = data.photos[0].src.landscape;
      document.getElementById('hero').style.backgroundImage =
        `linear-gradient(rgba(6,17,31,.45), rgba(6,17,31,.62)), url(${image})`;
    }
  } catch(error){
    console.error('Unable to load Pexels image', error);
  }
}

async function loadForecast(){
  const params = new URLSearchParams(window.location.search);
  const place = params.get('place');
  const location = locations[place] || locations.miami;

  document.getElementById('title').textContent = `${location.name} Forecast`;

  await loadHeroImage(location);

  const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=10`);

  const data = await response.json();

  const html = data.daily.time.map((day,index)=>`
    <div class="day-card">
      <div>${new Date(day).toLocaleDateString('en-US',{weekday:'short'})}</div>
      <div class="day-emoji">${emoji(data.daily.weather_code[index])}</div>
      <div class="day-temp">${Math.round(data.daily.temperature_2m_max[index])}°</div>
      <div>${Math.round(data.daily.temperature_2m_min[index])}° low</div>
    </div>
  `).join('');

  document.getElementById('forecast').innerHTML = html;
}

loadForecast();
</script>
</body>
</html>
